<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Town</title>
    <link rel="stylesheet" href="css/DogTown_Login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
   
    

</head>

<body>
    <header class="cabecalho">
       
        
        <div class="logo"><img src="img/Logo DogTown PNG.png" alt="Foto Logo" width="300" height="200"></i></div>
           
        <nav class="nav-menu">
                <img src="" alt="">
                <a href="#"><i class="fa-regular fa-house" style="color: rgb(224, 228, 234);"></i></i>Inicio</a>
                <a href="#"><i class="fa-solid fa-bone" style="color: rgb(224, 228, 234);"></i></i>Produtos</a>
                <a href="#"><i class="fa-solid fa-bars" style="color: rgb(224, 228, 234);"></i></i>Serviços</a>
                <a href="#"><i class="fa-solid fa-phone-volume" style="color: rgb(224, 228, 234);"></i></i>Contatos</a>
                <a href="#"><i class="fa-solid fa-circle-info" style="color: rgb(224, 228, 234);"></i></i>Quem Somos</a>
        </nav>
            
        
    </header>
    <main class="conteudo">

        <section class="area-cards">
            
            <article class="card">

                <div class="logocard">
                 <div class="logo"><img src="img/img dog login png.png" alt="Foto Logo" width="250" height="150"></i></div>
           
                </div>
                <form>

                   <div class="email-senha">
                         <br>
                     <input type="text" placeholder="E-Mail">
                        <br>
                     <input type="password" placeholder="Senha CONTATO">
                        <br><br>
                    </div> 
                    
                    <div class="dados">
                        <p> <input type="checkbox"> Remenber me</p>

                        <p> <input type="checkbox"> Esqueci a Senha</p>
                    </div>

                    
                    <button class="botao">
                        Login
                    </button>
                </form>    

            </article>
        </section>

    </main>

    <footer class="rodape">
        <p>Nossa prioridade é a proteção do seus dados</p>
    </footer>
</body>

</html>
